<title>饭搭子 · 核心交互</title><desc>1920 × 1080 UX 作品集框架；12 栏，栏宽 118，栏距 24，左右边距 120，上下边距 80。文字可编辑；所有视觉素材均为矢量占位框。参考浅暖背景、圆形节点与轻量连线。内容依据用户提供文案及现有原型；设计假设和原型范围在对应模块注明。</desc>
