<g id="p02-design-challenge-047" data-name="design-challenge">
<rect x="120" y="895" width="1680" height="79" rx="24" fill="#E7EEDF"/>
<text id="p02-challenge-heading-048" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#435A49" xml:space="preserve">
<tspan x="144" y="939">设计挑战</tspan>
</text>
<text id="p02-challenge-takeaway-049" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="24" font-weight="500" fill="#435A49" xml:space="preserve">
<tspan x="302" y="941.6">如何让饮食更容易记录与理解、留下生活记忆，并支持下一餐选择与共同坚持？</tspan>
</text>
