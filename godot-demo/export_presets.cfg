[preset.0]
name="Windows Demo"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="design/routes.json,design/variables.json,design/furniture.json"
exclude_filter="tests/*,build/*,qa/*,ai_service/*,design/contexts/*,tools/*,design/figma-snapshot.json,design/snapshot.lzw.b64"
export_path="build/FanDazi.pck"
encryption_include_filters=""
