<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
<title>饭搭子 · 项目概览</title><desc>1920 × 1080 UX 作品集框架；12 栏，栏宽 118，栏距 24，左右边距 120，上下边距 80。文字可编辑；所有视觉素材均为矢量占位框。参考浅暖背景、圆形节点与轻量连线。内容依据用户提供文案及现有原型；设计假设和原型范围在对应模块注明。</desc>
<g id="p01-canvas-background-001" data-name="canvas-background">
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F4F6EF"/>
</g>
<g id="p01-project-introduction-five-columns-002" data-name="project-introduction-five-columns">
<text id="p01-section-label-003" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#435A49" xml:space="preserve">
<tspan x="120" y="92.6">UX / PRODUCT DESIGN</tspan>
</text>
<text id="p01-page-title-004" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="56" font-weight="700" fill="#1F1F1F" xml:space="preserve">
<tspan x="120" y="189.4">饭搭子</tspan>
</text>
<text id="p01-project-subtitle-005" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="30" font-weight="500" fill="#1F1F1F" xml:space="preserve">
<tspan x="120" y="249">食宠陪伴式饮食健康 APP</tspan>
</text>
<text id="p01-introduction-one-006" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#1F1F1F" xml:space="preserve">
<tspan x="120" y="307.3">饭搭子是一款面向年轻用户的轻量饮食健康应用。</tspan>
<tspan x="120" y="334.3">用户通过拍照记录日常餐食，系统自动识别食物与营养信息。</tspan>
</text>
<text id="p01-introduction-two-007" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#1F1F1F" xml:space="preserve">
<tspan x="120" y="412.3">这些数据进一步转化为虚拟食宠的精力、饱腹、消化与生活状态，让抽象数据获得直观</tspan>
<tspan x="120" y="439.3">反馈。</tspan>
</text>
<text id="p01-introduction-three-008" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#1F1F1F" xml:space="preserve">
<tspan x="120" y="488.3">餐食照片变成食物贴纸，在手账中积累饮食记忆；记录进一步支持下一餐建议，再与好</tspan>
<tspan x="120" y="515.3">友 / 情侣共同照顾，让健康行为持续发生。</tspan>
</text>
<rect x="120" y="558" width="78" height="32" rx="16" fill="#E7EEDF"/>
<text id="p01-tag-009" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#435A49" xml:space="preserve">
