<tspan x="120" y="92.6">CORE FLOW / 四步主流程 + 两条延伸路径</tspan>
</text>
<text id="p06-page-index-004" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#666666" xml:space="preserve">
