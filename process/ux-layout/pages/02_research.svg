<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
<title>饭搭子 · 问题洞察与行为调研</title><desc>1920 × 1080 UX 作品集框架；12 栏，栏宽 118，栏距 24，左右边距 120，上下边距 80。文字可编辑；所有视觉素材均为矢量占位框。参考浅暖背景、圆形节点与轻量连线。内容依据用户提供文案及现有原型；设计假设和原型范围在对应模块注明。</desc>
<g id="p02-canvas-background-001" data-name="canvas-background">
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F4F6EF"/>
</g>
<g id="p02-page-header-002" data-name="page-header">
<text id="p02-section-label-003" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#435A49" xml:space="preserve">
<tspan x="120" y="92.6">RESEARCH / 问题洞察</tspan>
</text>
<text id="p02-page-index-004" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#666666" xml:space="preserve">
<tspan x="1757" y="92.6">02 / 08</tspan>
</text>
<text id="p02-page-title-005" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#1F1F1F" xml:space="preserve">
<tspan x="120" y="159.2">健康饮食不难理解，难的是长期坚持</tspan>
</text>
<text id="p02-page-subtitle-006" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#666666" xml:space="preserve">
<tspan x="120" y="196.3">照片分享促成了持续记录；进一步探索：把照片留成手账记忆，把记录用于下一餐选择。（设计假设）</tspan>
</text>
</g>
<g id="p02-three-circular-problem-nodes-007" data-name="three-circular-problem-nodes">
<line x1="205" y1="311" x2="1341" y2="311" stroke="#E7EEDF" stroke-width="18"/>
<g id="p02-problem-1-008" data-name="problem-1">
<circle cx="205" cy="305" r="85" fill="#E1E6DA"/>
<text id="p02-problem-index-009" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#435A49" xml:space="preserve">
<tspan x="197" y="260.6">01</tspan>
</text>
<text id="p02-problem-heading-010" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#1F1F1F" xml:space="preserve">
<tspan x="150" y="311.8">记录成本高</tspan>
</text>
<text id="p02-problem-body-011" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#1F1F1F" xml:space="preserve">
<tspan x="310" y="244.3">搜索食物、选择份量、输入重量和确认营养数</tspan>
<tspan x="310" y="269.3">据，单次操作并不复杂，但每天重复会逐渐形</tspan>
<tspan x="310" y="294.3">成负担。</tspan>
</text>
<text id="p02-problem-takeaway-012" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="24" font-weight="500" fill="#435A49" xml:space="preserve">
<tspan x="120" y="427.6">用户不是不会记录，</tspan>
<tspan x="120" y="457.6">而是不愿意每顿饭都认真记录。</tspan>
</text>
</g>
<g id="p02-problem-2-013" data-name="problem-2">
<circle cx="773" cy="305" r="85" fill="#E1E6DA"/>
<text id="p02-problem-index-014" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#435A49" xml:space="preserve">
<tspan x="765" y="260.6">02</tspan>
</text>
<text id="p02-problem-heading-015" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#1F1F1F" xml:space="preserve">
<tspan x="707" y="311.8">数据缺乏直觉</tspan>
</text>
<text id="p02-problem-body-016" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#1F1F1F" xml:space="preserve">
<tspan x="878" y="244.3">热量、脂肪、膳食纤维和咖啡因等数据能够准</tspan>
<tspan x="878" y="269.3">确描述一顿饭，却未必能直接帮助用户理解“</tspan>
<tspan x="878" y="294.3">这顿饭对我今天意味着什么”。</tspan>
</text>
<text id="p02-problem-takeaway-017" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="24" font-weight="500" fill="#435A49" xml:space="preserve">
<tspan x="688" y="427.6">数据被记录了，但没有真正转化为感受。</tspan>
</text>
</g>
<g id="p02-problem-3-018" data-name="problem-3">
<circle cx="1341" cy="305" r="85" fill="#E1E6DA"/>
<text id="p02-problem-index-019" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#435A49" xml:space="preserve">
<tspan x="1333" y="260.6">03</tspan>
</text>
<text id="p02-problem-heading-020" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#1F1F1F" xml:space="preserve">
<tspan x="1275" y="311.8">健康反馈太慢</tspan>
</text>
<text id="p02-problem-body-021" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#1F1F1F" xml:space="preserve">
<tspan x="1446" y="244.3">饮食行为发生在当下，但身体变化往往需要更</tspan>
<tspan x="1446" y="269.3">长时间才能看到，用户每天承担记录成本，却</tspan>
<tspan x="1446" y="294.3">缺少即时奖励。</tspan>
</text>
<text id="p02-problem-takeaway-022" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="24" font-weight="500" fill="#435A49" xml:space="preserve">
<tspan x="1256" y="427.6">即时投入很多，及时反馈很少。</tspan>
</text>
</g>
</g>
<g id="p02-behavior-probe-023" data-name="behavior-probe">
<text id="p02-probe-heading-024" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="24" font-weight="500" fill="#1F1F1F" xml:space="preserve">
<tspan x="120" y="513.6">真实行为探针：用已有社交行为验证“共同记录是否更容易坚持”</tspan>
</text>
<g id="p02-probe-participants-025" data-name="probe-participants">
<rect x="120" y="536" width="260" height="244" rx="24" fill="#FAFBF8" stroke="#E5E5E5" stroke-width="1"/>
</g>
<g id="p02-probe-method-026" data-name="probe-method">
<rect x="404" y="536" width="402" height="244" rx="24" fill="#FAFBF8" stroke="#E5E5E5" stroke-width="1"/>
</g>
<g id="p02-probe-results-027" data-name="probe-results">
<rect x="830" y="536" width="402" height="244" rx="24" fill="#FAFBF8" stroke="#E5E5E5" stroke-width="1"/>
</g>
<g id="p02-probe-key-insight-028" data-name="probe-key-insight">
<rect x="1256" y="536" width="544" height="244" rx="24" fill="#E7EEDF" stroke="#E5E5E5" stroke-width="1"/>
</g>
<text id="p02-participants-heading-029" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#1F1F1F" xml:space="preserve">
<tspan x="144" y="576">参与者</tspan>
</text>
<text id="p02-participants-metric-030" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="28" font-weight="500" fill="#435A49" xml:space="preserve">
<tspan x="144" y="626.2">10 组 / 20 人</tspan>
</text>
<text id="p02-participants-detail-031" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#1F1F1F" xml:space="preserve">
<tspan x="144" y="676.3">5 对好友</tspan>
<tspan x="144" y="706.3">5 对情侣</tspan>
</text>
<text id="p02-method-heading-032" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#1F1F1F" xml:space="preserve">
<tspan x="428" y="577.8">测试方式</tspan>
</text>
<text id="p02-method-detail-033" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#1F1F1F" xml:space="preserve">
<tspan x="428" y="615.3">参与者每天通过抖音聊天框互相发送自己的餐</tspan>
<tspan x="428" y="640.3">食照片。</tspan>
<tspan x="428" y="665.3">发送餐食既完成饮食分享，也能够延续双方聊</tspan>
<tspan x="428" y="690.3">天中的火花并持续养成小火人。</tspan>
</text>
<text id="p02-result-heading-034" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#1F1F1F" xml:space="preserve">
<tspan x="854" y="577.8">观察结果</tspan>
</text>
<text id="p02-result-detail-035" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#1F1F1F" xml:space="preserve">
<tspan x="854" y="615.3">10 组中有 9 组持续进行了餐食分享。</tspan>
<tspan x="854" y="639.3">他们开始更主动地：</tspan>
</text>
<text id="p02-observed-behaviors-036" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#1F1F1F" xml:space="preserve">
<tspan x="854" y="695.3">• 记录自己吃了什么</tspan>
<tspan x="854" y="716.3">• 提醒对方发送餐食</tspan>
<tspan x="854" y="737.3">• 为了续火花持续分享</tspan>
<tspan x="854" y="758.3">• 关注对方当天是否正常吃饭</tspan>
</text>
<text id="p02-insight-heading-037" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#435A49" xml:space="preserve">
<tspan x="1280" y="577.8">关键发现</tspan>
</text>
<text id="p02-insight-detail-038" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#1F1F1F" xml:space="preserve">
<tspan x="1280" y="615.3">原本依赖个人自律完成的饮食记录，在加入关系和连续成长之后，</tspan>
<tspan x="1280" y="640.3">逐渐变成：</tspan>
</text>
<text id="p02-insight-quote-039" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="28" font-weight="500" fill="#435A49" xml:space="preserve">
<tspan x="1280" y="723.2">“我们今天还没有</tspan>
<tspan x="1280" y="757.2">互相发饭。”</tspan>
</text>
</g>
