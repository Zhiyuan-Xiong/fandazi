<tspan x="120" y="159.2">从一顿饭，到反馈、记忆与下一餐</tspan>
</text>
<text id="p06-page-subtitle-006" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#666666" xml:space="preserve">
<tspan x="120" y="196.3">生成贴纸可选，不阻断照片保存；参考食谱可加入计划，状态转译与历史推荐使用示例演示。</tspan>
</text>
